<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Kadai: a responsive e-commerce demo with cart, wishlist, auth, checkout and admin dashboard.">
<title>Kadai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky shop header, hero strip, chip row + filter sidebar + product grid; drawer for cart, modals for product/auth; single-page views for checkout, orders, admin. */
:root{
  --font-d:'Bricolage Grotesque',system-ui,sans-serif;
  --font-b:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#f5f7fb;--surface:#ffffff;--surface2:#eceff6;--line:#dde2ee;
  --fg:#141a2c;--muted:#5a6379;--accent:#2456e6;--accent-fg:#ffffff;--accent-soft:#e2e9ff;
  --good:#177a4a;--warn:#9a5b00;--bad:#c0322f;
  --tint-l:94%;--pc-l:48%;
  --shadow:0 1px 2px rgba(20,26,44,.06),0 10px 28px rgba(20,26,44,.07);
  --r:14px;
}
:root[data-palette="sage"]{--bg:#f3f7f4;--surface2:#e8efea;--line:#d6e2da;--fg:#14231b;--muted:#53685b;--accent:#2b7550;--accent-soft:#dcefe3;--shadow:0 1px 2px rgba(20,35,27,.06),0 10px 28px rgba(20,35,27,.07)}
:root[data-palette="clay"]{--bg:#fbf6f2;--surface2:#f3e9e1;--line:#e8d9ce;--fg:#2a1a14;--muted:#6e564b;--accent:#bf4f29;--accent-soft:#fbe3d7;--shadow:0 1px 2px rgba(42,26,20,.06),0 10px 28px rgba(42,26,20,.07)}
:root[data-palette="lilac"]{--bg:#f7f5fc;--surface2:#eeeaf8;--line:#e0daf0;--fg:#1d1730;--muted:#625a7d;--accent:#7549d1;--accent-soft:#ebe3fb;--shadow:0 1px 2px rgba(29,23,48,.06),0 10px 28px rgba(29,23,48,.07)}
:root[data-palette="rose"]{--bg:#fcf5f7;--surface2:#f6e8ec;--line:#eed8df;--fg:#2b141d;--muted:#755861;--accent:#c4325c;--accent-soft:#fbe0e8;--shadow:0 1px 2px rgba(43,20,29,.06),0 10px 28px rgba(43,20,29,.07)}
:root[data-palette="night"]{color-scheme:dark;--bg:#0e1117;--surface:#171b24;--surface2:#1f2431;--line:#2b3142;--fg:#eef1f8;--muted:#9aa3b9;--accent:#7aa2ff;--accent-fg:#0b1020;--accent-soft:#1c2748;--good:#4cc38a;--warn:#e0a63c;--bad:#f07a76;--tint-l:20%;--pc-l:62%;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35)}

[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{font-family:var(--font-d);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1280px;margin-inline:auto;padding-inline:clamp(16px,3vw,32px)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;background:var(--accent);color:var(--accent-fg);padding:10px 18px;border-radius:999px;font-weight:600;transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn:active{transform:none}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2);box-shadow:none}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{position:relative;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);transition:background .15s}
.icon-btn:hover{background:var(--surface2)}
.icon-btn svg,.btn svg{width:19px;height:19px;flex:none}
.count{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--accent-fg);font-size:11px;font-weight:700;display:grid;place-items:center}
.count:empty{display:none}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:13px;font-weight:600}
.field input,.field select,.field textarea,.sort select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.field .err{color:var(--bad);font-size:12px;min-height:0}
.field .err:empty{display:none}
.field.bad input,.field.bad select{border-color:var(--bad)}
.row{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.row.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:560px){.row,.row.three{grid-template-columns:minmax(0,1fr)}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding-block:12px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-family:var(--font-d);font-weight:700;font-size:26px;letter-spacing:-.03em;color:var(--fg)}
.mark{width:14px;height:14px;border-radius:50% 50% 50% 4px;background:var(--accent);transform:rotate(-12deg);transition:transform .3s}
.brand:hover .mark{transform:rotate(168deg)}
.search{position:relative;max-width:560px;width:100%;justify-self:center}
.search form{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px}
.search form:focus-within{outline:2px solid var(--accent)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;padding:11px 0;outline:none}
.search kbd{font:12px var(--font-b);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
#sug{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;z-index:5}
#sug button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px}
#sug button:hover,#sug button:focus-visible{background:var(--surface2)}
#sug .th{width:36px;height:36px;border-radius:8px;flex:none;overflow:hidden}
#sug .th svg{width:100%;height:100%}
#sug small{color:var(--muted);display:block}
.actions{display:flex;align-items:center;gap:8px}
.sw{width:18px;height:18px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.avatar{width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);font-weight:700}
.signin{white-space:nowrap}
@media(max-width:720px){
  .bar{grid-template-columns:minmax(0,1fr) auto;row-gap:10px}
  .search{grid-column:1/-1;grid-row:2;max-width:none}
  .brand{font-size:23px}
  .search kbd{display:none}
}
@media(max-width:420px){.actions{gap:6px}.icon-btn,.avatar{width:38px;height:38px}}

/* popover */
#pop{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px;min-width:220px;max-width:calc(100vw - 24px)}
#pop h4{font-size:14px;padding:4px 8px 8px}
.pal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pal button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:12px}
.pal button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pal i{width:26px;height:26px;border-radius:50%;display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px}
.menu button:hover{background:var(--surface2)}
.menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu .who small{color:var(--muted);display:block;overflow-wrap:anywhere}

/* hero */
.hero{margin-top:22px;border-radius:22px;background:var(--accent-soft);padding:clamp(22px,4vw,44px);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px;align-items:center;overflow:hidden}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--accent)}
.hero h1{font-size:clamp(30px,4.6vw,54px);margin:10px 0 12px;max-width:16ch}
.hero p{color:var(--muted);max-width:44ch}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;border:1.5px dashed var(--accent);color:var(--accent);padding:7px 12px;border-radius:10px;background:var(--surface)}
.collage{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.collage .art{border-radius:18px;aspect-ratio:3/4}
.collage .art:nth-child(2){transform:translateY(18px)}
@media(max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}.collage{display:none}}

/* shop */
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:22px 6px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:999px;font-weight:500;transition:background .15s}
.chip:hover{background:var(--surface2)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip small{opacity:.65;margin-left:4px}
.shop{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;padding-block:14px 56px;align-items:start}
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 132px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:20px}
.filters h3{font-size:15px}
.fg{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.opt input{accent-color:var(--accent);width:16px;height:16px}
.fhead{display:none}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sort{display:flex;align-items:center;gap:8px;font-size:14px}
.sort select{width:auto;padding:8px 10px}
.fbtn{display:none}
.active{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border:0;border-radius:99px;padding:5px 8px 5px 12px;font-size:13px;font-weight:500}
.tag svg{width:14px;height:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(180px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--accent) 12%,transparent),transparent 70%)}
.card:hover::after{opacity:1}
.art{--pc:hsl(var(--h,210) 56% var(--pc-l));background:hsl(var(--h,210) 52% var(--tint-l));display:grid;place-items:center;position:relative}
.art svg{width:62%;height:62%;transition:transform .3s}
.card:hover .art svg{transform:scale(1.06) rotate(-2deg)}
.card .art{aspect-ratio:1/1;cursor:pointer;border:0;width:100%;padding:0}
.badge{position:absolute;left:10px;top:10px;background:var(--surface);color:var(--fg);font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;z-index:1}
.badge.sale{background:var(--accent);color:var(--accent-fg)}
.wish{position:absolute;right:10px;top:10px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.wish svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;transition:transform .2s}
.wish[aria-pressed="true"]{color:var(--bad)}
.wish[aria-pressed="true"] svg{fill:currentColor;transform:scale(1.1)}
.cinfo{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.cinfo .brandn{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.cinfo .nm{font-family:var(--font-d);font-weight:500;font-size:16px;line-height:1.25;background:none;border:0;padding:0;text-align:left}
.cinfo .nm:hover{color:var(--accent)}
.stars{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.stars b{color:var(--fg)}
.stars svg{width:14px;height:14px;fill:#e5a100}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.price b{font-size:18px;font-family:var(--font-d)}
.price s{color:var(--muted);font-size:13px}
.price em{font-style:normal;color:var(--good);font-size:13px;font-weight:600}
.cinfo .btn{margin-top:8px}
.low{color:var(--warn);font-size:12px;font-weight:600}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:48px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{font-size:20px}
.pager{display:flex;gap:6px;justify-content:center;margin-top:28px;flex-wrap:wrap}
.pager button{min-width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.pager button[aria-current="page"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
@media(max-width:900px){
  .shop{grid-template-columns:minmax(0,1fr)}
  .fbtn{display:inline-flex}
  .filters{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:82vh;overflow:auto;z-index:50;border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .3s;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .filters.open{transform:none;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
  .fhead{display:flex;justify-content:space-between;align-items:center}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .cinfo{padding:10px}
  .cinfo .nm{font-size:14px}
}

/* overlays */
#scrim{position:fixed;inset:0;background:rgba(10,14,26,.45);z-index:40;opacity:0;transition:opacity .25s}
#scrim.on{opacity:1}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--bg);z-index:45;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
#drawer.on{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.dh h3{font-size:20px}
.db{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.df{border-top:1px solid var(--line);padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.line{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px}
.line .art{border-radius:12px;aspect-ratio:1/1}
.line .art svg{width:70%;height:70%}
.line h4{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.line .ctl{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;background:var(--surface)}
.qty button{width:32px;height:32px;border:0;background:none;border-radius:50%;display:grid;place-items:center}
.qty button:hover{background:var(--surface2)}
.qty svg{width:14px;height:14px}
.qty span{min-width:26px;text-align:center;font-weight:600}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);font-size:13px;text-decoration:underline}
.linkbtn:hover{color:var(--bad)}
.sum{display:flex;flex-direction:column;gap:8px}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .tot{font-weight:700;font-size:18px;font-family:var(--font-d);border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.bar-track{height:6px;background:var(--surface2);border-radius:9px;overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .4s}
.coupon{display:flex;gap:8px}
.coupon input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);text-transform:uppercase}
#modal{position:fixed;inset:0;z-index:55;display:grid;place-items:center;padding:16px}
#modal .scr{position:absolute;inset:0;background:rgba(10,14,26,.5)}
.dlg{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:22px;width:min(920px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .22s ease-out}
.dlg.narrow{width:min(440px,100%)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}
.x{position:absolute;right:14px;top:14px;z-index:3}
.pd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pd .art{aspect-ratio:1/1;border-radius:22px 0 0 22px}
.pd .art svg{width:60%;height:60%}
.pd .info{padding:32px 28px;display:flex;flex-direction:column;gap:14px}
.pd h2{font-size:28px}
.pd ul{margin:0;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.pd .buy{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.related{padding:0 28px 28px}
.related h4{margin-bottom:12px}
.rel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rel button{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 0 10px;text-align:left;overflow:hidden;font-size:13px}
.rel .art{aspect-ratio:4/3}
.rel .art svg{height:70%}
.rel span{display:block;padding:8px 10px 0}
@media(max-width:720px){.pd{grid-template-columns:minmax(0,1fr)}.pd .art{border-radius:22px 22px 0 0;aspect-ratio:4/3}.pd .info{padding:20px}.related{padding:0 20px 20px}}
.auth{padding:30px 28px;display:flex;flex-direction:column;gap:16px}
.auth h2{font-size:26px}
.tabs{display:flex;background:var(--surface2);border-radius:99px;padding:4px;gap:4px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:99px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hint{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.formerr{color:var(--bad);font-size:13px}
#toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:500;box-shadow:var(--shadow);animation:pop .25s ease-out}

/* panels, checkout, orders */
.page{padding-block:28px 64px}
.page>h1{font-size:clamp(26px,3.4vw,38px);margin-bottom:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel h3{font-size:18px;margin-bottom:14px}
.co{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;margin-top:20px;align-items:start}
.co .stack{display:flex;flex-direction:column;gap:18px}
.co aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px)}

function shipFor(sub){return sub>=999?0:79}
async function seed(){
  if(!users){
    users=[{name:'Kadai Admin',email:'admin@kadai.in',hash:await hash('admin123'),role:'admin',joined:Date.now()-864e5*40},
           {name:'Demo Shopper',email:'demo@kadai.in',hash:await hash('demo123'),role:'customer',joined:Date.now()-864e5*12}];
    store.set('kd.users',users);
  }
  if(!orders){
    const r=rng(42);orders=[];
    for(let i=0;i<46;i++){
      const off=Math.floor(r()*14),c=CUST[Math.floor(r()*CUST.length)];
      const n=1+Math.floor(r()*3),items=[];
      for(let k=0;k<n;k++){const p=SEED[Math.floor(r()*SEED.length)];if(!items.find(x=>x.id===p.id))items.push({id:p.id,name:p.name,price:p.price,qty:1+Math.floor(r()*2),art:p.art,h:p.h})}
      const sub=items.reduce((s,x)=>s+x.price*x.qty,0),total=sub+shipFor(sub);
      let st=off>8?'Delivered':off>4?(r()<.6?'Delivered':'Shipped'):off>1?(r()<.5?'Packed':'Shipped'):'Placed';
      if(r()<.06)st='Cancelled';
      orders.push({id:'KD-'+(1000+i),email:c[1],name:c[0],date:Date.now()-off*864e5-Math.floor(r()*8e7),items,sub,total,status:st,pay:['UPI','Card','COD'][Math.floor(r()*3)],demo:true});
    }
    orders.sort((a,b)=>b.date-a.date);saveO();
  }
  const em=store.get('kd.session',null);S.user=em?users.find(u=>u.email===em)||null:null;
}

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toasts').append(t);setTimeout(()=>t.remove(),2400)}

function calc(ship){
  const lines=S.cart.map(i=>({p:prod(i.id),qty:i.qty})).filter(l=>l.p);
  const sub=lines.reduce((s,l)=>s+l.p.price*l.qty,0);
  const d=S.coupon==='KADAI10'?Math.round(sub*.1):0;
  let sh=lines.length?shipFor(sub):0;
  if(S.coupon==='FREESHIP')sh=0;
  const exp=ship==='express'&&lines.length?149:0;
  const total=sub-d+sh+exp;
  return{lines,sub,d,sh,exp,total,gst:total*18/118,count:lines.reduce((s,l)=>s+l.qty,0)};
}

function filtered(){
  const q=S.q.trim().toLowerCase().split(/\s+/).filter(Boolean),b=BANDS[S.band];
  let l=products.filter(p=>{
    if(q.length){const h=(p.name+' '+p.brand+' '+p.cat+' '+p.desc).toLowerCase();if(!q.every(w=>h.includes(w)))return false}
    if(S.cat&&p.cat!==S.cat)return false;
    if(S.brands.size&&!S.brands.has(p.brand))return false;
    if(p.price<b[1]||p.price>b[2])return false;
    if(p.rating<S.rating)return false;
    if(S.stock&&p.stock<=0)return false;
    return true;
  });
  const s=S.sort;
  if(s==='plow')l.sort((a,b)=>a.price-b.price);
  else if(s==='phigh')l.sort((a,b)=>b.price-a.price);
  else if(s==='rating')l.sort((a,b)=>b.rating-a.rating||b.rev-a.rev);
  else if(s==='disc')l.sort((a,b)=>disc(b)-disc(a));
  else if(s==='pop')l.sort((a,b)=>b.rev-a.rev);
  return l;
}

  $('#count').textContent=`${l.length} product${l.length===1?'':'s'}`+(S.q?` for "${S.q}"`:'');
  $('#grid').innerHTML=slice.length?slice.map(card).join(''):`<div class="empty" style="grid-column:1/-1"><h3>No products match</h3><p class="muted">Try a different search or remove some filters.</p><button class="btn soft" data-act="clear">Clear filters</button></div>`;
  const tags=[];
  if(S.q)tags.push(['q',`Search: ${S.q}`]);
  if(S.band)tags.push(['band',BANDS[S.band][0]]);
  if(S.rating)tags.push(['rating',`${S.rating}+ stars`]);

function addToCart(id,q=1){
  const p=prod(id);if(!p||p.stock<=0)return;
  const l=S.cart.find(i=>i.id===p.id);
  const cur=l?l.qty:0;
  if(cur+q>p.stock){toast(`Only ${p.stock} available`);return}
  if(l)l.qty+=q;else S.cart.push({id:p.id,qty:q});
  saveC();updateBadges();toast(`Added ${p.name}`);if(!$('#drawer').hidden)renderDrawer();
}

function fe(id,msg){const e=$('#'+id+'-e');if(e){e.textContent=msg||'';e.closest('.field')?.classList.toggle('bad',!!msg)}return !msg}
async function submitAuth(form){
  const reg=form.dataset.m==='register',email=$('#ae').value.trim().toLowerCase(),pw=$('#ap').value;
  let ok=true;
  if(reg)ok=fe('an',$('#an').value.trim().length<2?'Enter your full name':'')&&ok;
  ok=fe('ae',/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)?'':'Enter a valid email address')&&ok;
  ok=fe('ap',pw.length<(reg?6:1)?(reg?'Use at least 6 characters':'Enter your password'):'')&&ok;
  if(!ok)return;
  const h=await hash(pw),f=$('#af-e');
  if(reg){
    if(users.find(u=>u.email===email)){f.textContent='An account with this email already exists. Sign in instead.';return}
    const u={name:$('#an').value.trim(),email,hash:h,role:'customer',joined:Date.now()};
    users.push(u);store.set('kd.users',users);login(u);
  }else{
    const u=users.find(x=>x.email===email);
    if(!u||u.hash!==h){f.textContent='Email or password is incorrect.';return}
    login(u);
  }
}

function niceMax(v){const e=Math.pow(10,Math.floor(Math.log10(v||1))),n=v/e;return(n<=1?1:n<=2?2:n<=5?5:10)*e}
function revChart(days){
  const W=480,H=230,L=54,B=28,T=12,R=14,max=niceMax(Math.max(...days.map(d=>d.v),1)),iw=W-L-R,ih=H-T-B;
  const x=i=>L+i*iw/(days.length-1),y=v=>T+ih-v/max*ih;
  const pts=days.map((d,i)=>[x(i),y(d.v)]),line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${x(days.length-1)} ${T+ih} L${L} ${T+ih} Z`;
  const fmt=v=>v>=1e5?(v/1e5)+'L':v>=1e3?(v/1e3)+'k':v;
  let g='';for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L-8}" y="${yy+4}" text-anchor="end">₹${fmt(v)}</text>`}
  const xl=days.map((d,i)=>(days.length-1-i)%4===0?`<text x="${x(i)}" y="${H-8}" text-anchor="${i===0?'start':i===days.length-1?'end':'middle'}">${d.l}</text>`:'').join('');
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenue for the last 14 days">${g}<path d="${area}" fill="var(--accent)" opacity=".13"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${xl}${days.map((d,i)=>`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="8" fill="transparent"><title>${d.l}: ${INR(d.v)}</title></circle>`).join('')}<circle cx="${last[0]}" cy="${last[1]}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/></svg>`;
}

  openf:()=>$('#filters').classList.add('open'),closef:()=>$('#filters').classList.remove('open'),
  themes:t=>{const cur=document.documentElement.dataset.palette||'cobalt';
    pop(`<h4>Colour theme</h4><div class="pal">${PALS.map(p=>`<button data-act="setpal" data-p="${p[0]}" aria-pressed="${cur===p[0]}"><i style="background:${p[2]}"></i>${p[1]}</button>`).join('')}</div>`,t)},
  setpal:t=>{setPal(t.dataset.p);$$('#pop .pal button').forEach(b=>b.setAttribute('aria-pressed',b===t))},
  menu:t=>pop(`<div class="menu"><div class="who"><b>${esc(S.user.name)}</b><small>${esc(S.user.email)}</small></div><button data-act="go" data-v="orders">My orders</button><button data-act="go" data-v="wishlist">Wishlist</button>${S.user.role==='admin'?'<button data-act="go" data-v="admin">Admin dashboard</button>':''}<button data-act="logout">Sign out</button></div>`,t),
  logout:()=>logout(),
  auth:t=>openAuth(t.dataset.m,afterAuth),
  fill:t=>{$('#ae').value=t.dataset.e;$('#ap').value=t.dataset.p},
  atab:t=>{S.atab=t.dataset.t;S.aq='';$$('.chip[data-act="atab"]').forEach(b=>b.setAttribute('aria-pressed',b===t));adminBody()},
  padd:()=>productForm(),pedit:t=>productForm(prod(t.dataset.id)),
  pdel:t=>{if(t.dataset.sure){products=products.filter(p=>p.id!==+t.dataset.id);S.cart=S.cart.filter(i=>i.id!==+t.dataset.id);S.wish=S.wish.filter(i=>i!==+t.dataset.id);saveP();saveC();saveW();updateBadges();prodRows();toast('Product deleted')}else{t.dataset.sure='1';t.textContent='Confirm?'}}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!e.target.closest('#pop')&&!e.target.closest('[data-act="themes"],[data-act="menu"]'))closePop();
  if(!e.target.closest('.search'))sug.hidden=true;
  if(!t||t.tagName==='SELECT')return;
  e.preventDefault();const f=H[t.dataset.act];if(f)f(t,e);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-act="ostat"]')){const o=orders.find(x=>x.id===t.dataset.id);if(o){o.status=t.value;saveO();toast(`${o.id} marked ${o.status}`)}return}
  if(t.id==='sort'){S.sort=t.value;S.page=1;updateGrid()}
  else if(t.name==='band'){S.band=+t.value;S.page=1;updateGrid()}
  else if(t.name==='rating'){S.rating=+t.value;S.page=1;updateGrid()}
  else if(t.name==='brand'){t.checked?S.brands.add(t.value):S.brands.delete(t.value);S.page=1;updateGrid()}
  else if(t.name==='stock'){S.stock=t.checked;S.page=1;updateGrid()}
  else if(t.name==='ship'){S.ship=t.value;const c=calc(S.ship);$('#cosum').innerHTML=summaryHTML(c);$('#place').textContent=`Place order · ${INR(c.total)}`}
  else if(t.name==='pay'){S.pay=t.value;payFields()}
});
document.addEventListener('input',e=>{
  if(e.target.id==='paq')prodRows();
  if(e.target.id==='oaq')orderRows();
  if(e.target.id==='cno'){const v=e.target.value.replace(/\D/g,'').slice(0,16);e.target.value=v.replace(/(.{4})/g,'$1 ').trim()}
  if(e.target.id==='cex'){let v=e.target.value.replace(/\D/g,'').slice(0,4);if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);e.target.value=v}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='aform')submitAuth(f);
  else if(f.id==='coform')placeOrder();
  else if(f.id==='pform')saveProduct(f);
  else if(f.id==='cform'){const c=$('#cin').value.trim().toUpperCase();
    if(!c){S.coupon='';saveC();renderDrawer();return}
    if(c==='KADAI10'||c==='FREESHIP'){S.coupon=c;saveC();renderDrawer();toast('Coupon applied')}else toast('That coupon code is not valid')}
});

/* ---------- theme & cursor ---------- */
function setPal(p){
  if(p==='cobalt')delete document.documentElement.dataset.palette;else document.documentElement.dataset.palette=p;
  store.set('kd.palette',p);
}
setPal(store.get('kd.palette','cobalt'));
if(matchMedia('(pointer:fine)').matches&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
  const cur=$('#cur');let x=0,y=0,tx=0,ty=0;
  addEventListener('pointermove',e=>{
    tx=e.clientX;ty=e.clientY;cur.classList.add('on');
    cur.classList.toggle('grow',!!e.target.closest?.('a,button,select,label,input,[data-act]'));
    const c=e.target.closest?.('.card');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')}
  },{passive:true});
  document.documentElement.addEventListener('pointerleave',()=>cur.classList.remove('on'));
  (function loop(){x+=(tx-x)*.22;y+=(ty-y)*.22;cur.style.transform=`translate3d(${x}px,${y}px,0) translate(-50%,-50%)`;requestAnimationFrame(loop)})();
}

seed().then(()=>{updateAcct();render();updateBadges()});
})();
</script>

</body>
</html>
